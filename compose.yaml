x-python-service: &python-service
  build: .
  environment:
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: qwen3:0.6b
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_ENABLE_ASYNC_TRACE_LOGGING: "false"

x-mailpit-environment: &mailpit-environment
  MP_DATABASE: /data/mailpit.db
  MP_DISABLE_VERSION_CHECK: "true"
  MP_IGNORE_DUPLICATE_IDS: "true"
  MP_TAGS_DISABLE: "plus-addresses,x-tags"

x-mailpit: &mailpit
  image: axllent/mailpit:v1.28.4
  healthcheck:
    test: ["CMD", "/mailpit", "readyz"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  mailpit:
    <<: *mailpit
    environment:
      <<: *mailpit-environment
      MP_LABEL: Central
      MP_SMTP_ALLOWED_RECIPIENTS: "(?i)^complaints@demo[.]test$$"
      MP_SMTP_RELAY_HOST: mailpit-review
      MP_SMTP_RELAY_PORT: "1025"
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: "(?i)^review@demo[.]test$$"
      MP_SMTP_RELAY_PRESERVE_MESSAGE_IDS: "true"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - mailpit-central-data:/data

  mailpit-review:
    <<: *mailpit
    environment:
      <<: *mailpit-environment
      MP_LABEL: Manual Review
      MP_SMTP_ALLOWED_RECIPIENTS: "(?i)^review@demo[.]test$$"
    ports:
      - "127.0.0.1:8026:8025"
    volumes:
      - mailpit-review-data:/data

  # Keep the service and volume names so one Compose update reuses the existing inboxes.
  mailpit-team1:
    <<: *mailpit
    environment:
      <<: *mailpit-environment
      MP_LABEL: Billing
      MP_SMTP_ALLOWED_RECIPIENTS: "(?i)^billing@demo[.]test$$"
    ports:
      - "127.0.0.1:8027:8025"
    volumes:
      - mailpit-team1-data:/data

  mailpit-team2:
    <<: *mailpit
    environment:
      <<: *mailpit-environment
      MP_LABEL: Orders & Delivery
      MP_SMTP_ALLOWED_RECIPIENTS: "(?i)^orders@demo[.]test$$"
    ports:
      - "127.0.0.1:8028:8025"
    volumes:
      - mailpit-team2-data:/data

  mailpit-team3:
    <<: *mailpit
    environment:
      <<: *mailpit-environment
      MP_LABEL: Technical Support
      MP_SMTP_ALLOWED_RECIPIENTS: "(?i)^technical@demo[.]test$$"
    ports:
      - "127.0.0.1:8029:8025"
    volumes:
      - mailpit-team3-data:/data

  ollama:
    image: ollama/ollama:0.13.5
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////data/mlflow.db
      - --artifacts-destination=/data/artifacts
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  verify:
    <<: *python-service
    command: ["pytest", "-q", "-s", "tests/test_startup.py", "tests/test_triage.py"]
    depends_on:
      mailpit:
        condition: service_healthy
      mailpit-review:
        condition: service_healthy
      mailpit-team1:
        condition: service_healthy
      mailpit-team2:
        condition: service_healthy
      mailpit-team3:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  app:
    <<: *python-service
    command: ["python", "-m", "agent.worker"]
    restart: unless-stopped
    volumes:
      - ./src:/workspace/src
      - ./tests:/workspace/tests
      - ./sample_emails:/workspace/sample_emails:ro
    depends_on:
      verify:
        condition: service_completed_successfully

# All services communicate on the project's default Compose network.
volumes:
  mailpit-central-data:
  mailpit-review-data:
  mailpit-team1-data:
  mailpit-team2-data:
  mailpit-team3-data:
  ollama-data:
  mlflow-data:
