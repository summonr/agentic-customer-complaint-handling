x-python-service: &python-service
  build:
    context: .
    target: verification
  environment:
    MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  verify:
    <<: *python-service
    entrypoint: ["python", "-m", "verification.routing_verification"]
    command: ["--mode", "unit"]
    working_dir: /workspace
    volumes:
      - ./src:/workspace/src
      - hf-cache:/root/.cache/huggingface
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow-data:
  hf-cache:
