[project]
name = "agentic-email-triage"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1.2,<1.3",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.0,<2",
    "mlflow==3.18.0",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]
verification = [
    "datasets[arrow]>=3,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
